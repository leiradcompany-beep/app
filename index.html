<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leirad Services | Welcome</title>
    
    <!-- Font: 'Outfit' for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #e2e8f0;
            --accent-color: #3b82f6; /* Modern Soft Blue */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #0f172a; /* Deep Slate fallback */
            color: var(--primary-color);
            position: relative;
        }

        /* Subtle Ken Burns zoom effect on the background */
        .bg-layer {
            position: absolute;
            inset: -5%; /* Slightly larger to allow scaling without showing edges */
            background: url('assets/images/splash.png') no-repeat center center / cover;
            animation: kenBurns 10s ease-out forwards;
            z-index: 1;
        }

        /* Gradient overlay for text contrast and depth */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.6) 100%);
            z-index: 2;
        }

        .content-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        /* Cinematic blur-up reveal for text */
        .logo-text {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: revealUp 1.2s var(--ease-out-expo) 0.2s forwards;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 300;
            color: var(--secondary-color);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1.2s var(--ease-out-expo) 0.4s forwards;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1s var(--ease-out-expo) 0.8s forwards;
        }

        /* Sleek, glowing modern loader */
        .modern-loader {
            width: 48px;
            height: 48px;
            position: relative;
            margin-bottom: 1.5rem;
        }

        .modern-loader::before, 
        .modern-loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            inset: 0;
        }

        .modern-loader::before {
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .modern-loader::after {
            border: 2px solid transparent;
            border-top-color: var(--accent-color);
            border-right-color: rgba(59, 130, 246, 0.3);
            animation: spin 1.2s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
        }

        .loading-text {
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--secondary-color);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes kenBurns {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        /* Smooth Exit Transition */
        body.exit-active .bg-layer,
        body.exit-active .overlay {
            transition: opacity 0.8s ease-in-out;
            opacity: 0;
        }

        body.exit-active .content-container {
            animation: fadeOutUp 0.8s var(--ease-out-expo) forwards;
        }

        @keyframes fadeOutUp {
            from { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
            to { 
                opacity: 0; 
                transform: translateY(-40px) scale(0.98); 
                filter: blur(4px); 
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 3rem;
            }
            .tagline {
                font-size: 1rem;
                margin-bottom: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-layer"></div>
    <div class="overlay"></div>

    <!-- Content -->
    <div class="content-container">
        <h1 class="logo-text">Leirad Services</h1>
        <p class="tagline">Smart Cleaning. Pure Living.</p>

        <div class="loader-wrapper">
            <div class="modern-loader"></div>
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <script>
        // Configuration
        const redirectUrl = "landing/templates/index.html";
        const totalLoadTime = 3000; // 3 seconds

        window.addEventListener('load', () => {
            setTimeout(() => {
                // Trigger the exit animations
                document.body.classList.add('exit-active');

                // Redirect precisely when animation finishes
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 800); 

            }, totalLoadTime);
        });
    </script>
</body>
</html>
