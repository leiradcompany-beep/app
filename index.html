<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leirad Services | Initializing</title>
    
    <!-- Font: 'Outfit' for a clean, modern, and professional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. DESIGN TOKENS --- */
        :root {
            /* Backgrounds: Clean, Corporate, Light */
            --bg-primary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            
            /* Accents: Professional Blues indicating cleanliness and trust */
            --accent-primary: #0284c7;   /* Deep Trust Blue */
            --accent-secondary: #38bdf8; /* Clean Light Blue */
            
            /* Typography */
            --text-primary: #0f172a;     /* Slate 900 */
            --text-secondary: #64748b;   /* Slate 500 */
            --text-muted: #94a3b8;       /* Slate 400 */
            
            /* Animation Physics */
            --ease-professional: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- 2. RESET & LAYOUT --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            background-image: var(--bg-gradient);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            transition: opacity 0.6s ease-out;
        }

        /* --- 3. CONTENT WRAPPER --- */
        .content-layer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        /* --- 4. BRANDING ELEMENTS --- */
        .brand-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            color: var(--accent-primary);
            opacity: 0;
            transform: scale(0.8);
            animation: fadeUp 1s var(--ease-professional) forwards;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s var(--ease-professional) 0.2s forwards;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.1em;
            margin-bottom: 3rem;
            
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 1s var(--ease-professional) 0.4s forwards;
        }

        /* --- 5. PROFESSIONAL LOADER --- */
        .loader-wrapper {
            width: 100%;
            max-width: 240px;
            opacity: 0;
            animation: fadeIn 1s ease 0.6s forwards;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
            /* Matches the totalLoadTime in JS */
            animation: fillProgress 3.6s ease-in-out forwards;
        }

        .status-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* --- 6. ANIMATIONS --- */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn { 
            to { opacity: 1; } 
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            20% { width: 35%; }
            60% { width: 65%; }
            100% { width: 100%; }
        }

        /* EXIT: Smooth Fade Out instead of dramatic zoom */
        .exit-active {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .brand-icon { width: 48px; height: 48px; }
            .brand-title { font-size: 2.5rem; }
            .tagline { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="content-layer">
        
        <!-- Elegant SVG Icon (Abstract Sparkle/Leaf representing Cleanliness) -->
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.4 7.6 7.6 2.4-7.6 2.4L12 22l-2.4-7.6-7.6-2.4 7.6-2.4L12 2z"/>
        </svg>

        <h1 class="brand-title">Leirad Services</h1>
        <p class="tagline">Smart Cleaning. Pure Living.</p>

        <!-- Professional Linear Loader -->
        <div class="loader-wrapper">
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>
            <div class="status-text">Initializing Dashboard...</div>
        </div>

    </div>

    <script>
        // Configuration
        const redirectUrl = "landing/templates/index.html";
        const totalLoadTime = 4000; // 4 seconds total viewing time

        window.addEventListener('load', () => {
            setTimeout(() => {
                const body = document.body;
                
                // Trigger the smooth fade-out exit animation
                body.classList.add('exit-active');

                // Redirect when fade out completes
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 600); // Wait 600ms for the CSS transition to finish

            }, totalLoadTime);
        });
    </script>
</body>
</html>
